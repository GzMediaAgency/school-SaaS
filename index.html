<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المؤسسة التكوينية</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--light-blue) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            font-family: var(--font-family);
        }

        .login-container {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--primary-blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .login-title {
            text-align: center;
            color: var(--text-primary);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            text-align: right;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: right;
            direction: rtl;
            font-family: var(--font-family);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--light-blue);
            box-shadow: 0 0 0 3px rgba(69, 123, 157, 0.1);
        }

        .form-input::placeholder {
            color: #999;
        }

        .error-message {
            background: rgba(230, 57, 70, 0.1);
            color: var(--danger-red);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            border-right: 4px solid var(--danger-red);
        }

        .error-message.show {
            display: block;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background-color: var(--success-green);
            color: var(--text-white);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-family);
        }

        .btn-login:hover {
            background-color: #238b7e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(42, 157, 143, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .default-credentials {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .default-credentials strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .default-credentials a {
            color: var(--light-blue);
            font-weight: 600;
            text-decoration: none;
        }

        .default-credentials a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }
            .login-title {
                font-size: 1.5rem;
            }
            .logo-circle {
                width: 70px;
                height: 70px;
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <div class="logo-circle">🎓</div>
        </div>
        <h1 class="login-title" id="authTitle">نظام إدارة المؤسسة</h1>
        <p class="login-subtitle" id="authSubtitle">مرحباً بك، يرجى تسجيل الدخول للمتابعة</p>

        <div class="error-message" id="errorMessage"></div>

        <form id="authForm">
            <div class="form-group" id="institutionGroup" style="display:none;">
                <label class="form-label" for="institutionName">اسم المؤسسة</label>
                <input type="text" id="institutionName" class="form-input" placeholder="مثال : المؤسسة التكوينية النموذجية">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">البريد الإلكتروني</label>
                <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">كلمة المرور</label>
                <input type="password" id="password" class="form-input" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="btn-login" id="authSubmitBtn">تسجيل الدخول</button>
        </form>

        <p class="default-credentials">
            <a href="#" id="authToggleLink">مؤسسة جديدة؟ أنشئ حساباً</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
