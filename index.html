<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المؤسسة التكوينية</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--light-blue) 100%);
            padding: 1rem;
        }

        .login-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo-container { display: flex; justify-content: center; margin-bottom: 1.5rem; }
        .logo-circle {
            width: 90px; height: 90px; border-radius: 50%;
            background-color: var(--primary-blue);
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem;
        }

        .login-title {
            text-align: center; color: var(--primary-blue);
            font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem;
        }
        .login-subtitle {
            text-align: center; color: var(--text-secondary);
            font-size: 0.95rem; margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block; color: var(--text-primary);
            font-weight: 600; font-size: 1rem; margin-bottom: 0.5rem; text-align: right;
        }
        .form-input {
            width: 100%; padding: 0.85rem 1rem;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 1rem; transition: all 0.3s ease;
            text-align: right; direction: rtl;
        }
        .form-input:focus {
            outline: none; border-color: var(--light-blue);
            box-shadow: 0 0 0 3px rgba(69, 123, 157, 0.1);
        }

        .error-message {
            background: #ffebee; color: var(--danger-red);
            padding: 0.75rem 1rem; border-radius: 8px;
            margin-bottom: 1.25rem; text-align: center;
            font-size: 0.9rem; display: none;
            border-right: 4px solid var(--danger-red);
        }
        .error-message.show { display: block; }

        .btn-login {
            width: 100%; padding: 1rem;
            background-color: var(--success-green); color: #ffffff;
            border: none; border-radius: 8px;
            font-size: 1.1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            margin-top: 0.5rem; text-align: center;
        }
        .btn-login:hover { background-color: #238b7e; transform: translateY(-2px); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .signup-box {
            margin-top: 1.5rem;
            background: rgba(42, 157, 143, 0.08);
            border: 1px dashed var(--success-green);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }
        .signup-box p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .signup-box a {
            display: inline-block;
            color: #ffffff; background: var(--success-green);
            padding: 0.5rem 1.5rem; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 0.95rem;
        }
        .signup-box a:hover { background: #238b7e; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <div class="logo-circle">🎓</div>
        </div>
        <h1 class="login-title">نظام إدارة المؤسسة</h1>
        <p class="login-subtitle">مرحباً بك، يرجى تسجيل الدخول للمتابعة</p>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">البريد الإلكتروني</label>
                <input type="email" id="email" class="form-input" placeholder="example@email.com" required dir="ltr">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">كلمة المرور</label>
                <input type="password" id="password" class="form-input" placeholder="أدخل كلمة المرور" required dir="ltr">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
        </form>

        <!-- ❌ عبارة admin/admin محذوفة نهائياً -->
        <!-- ✅ صندوق التسجيل في التجربة المجانية -->
        <div class="signup-box">
            <p>🎁 ليس لديك حساب؟ استفد من التجربة المجانية</p>
            <a href="signup.html">إنشاء حساب جديد (15 يوم مجاناً)</a>
        </div>
    </div>

    <!-- ⚠️ IMPORTANT : plus de realm-db.js ici -->
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-db.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
