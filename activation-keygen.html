<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولّد رموز التفعيل (خاص بالمزوّد)</title>
    <link rel="stylesheet" href="css/variables.css">
    <style>
        body {
            background: var(--bg-primary);
            font-family: var(--font-family);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }
        .box {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(29,53,87,.12);
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
        p.note { color: var(--text-secondary); font-size: .9rem; margin: 0 0 1.5rem; }
        input, button {
            font-family: var(--font-family);
            font-size: 1rem;
        }
        input {
            width: 100%;
            padding: .8rem 1rem;
            border: 2px solid #e2e6eb;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: right;
        }
        button {
            width: 100%;
            padding: .9rem;
            background: var(--primary-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .key {
            margin-top: 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            direction: ltr;
            color: var(--success-green);
            word-break: break-all;
            min-height: 1.6em;
        }
        .history { margin-top: 1.5rem; text-align: right; font-size: .85rem; color: var(--text-secondary); }
        .history div { padding: .35rem 0; border-bottom: 1px dashed #e2e6eb; direction: ltr; text-align: left; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔑 مولّد رموز التفعيل</h1>
        <p class="note">صفحة خاصة بالمزوّد — لا تُسلَّم مع نسخة العميل.</p>

        <input type="text" id="client" placeholder="اسم المؤسسة / العميل (للتوثيق فقط)">
        <button id="gen">توليد رمز جديد</button>

        <div class="key" id="key"></div>
        <div class="history" id="history"></div>
    </div>

    <script src="js/subscription.js"></script>
    <script>
        const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const group = () => Array.from({ length: 4 }, () => ALPHABET[Math.floor(Math.random() * ALPHABET.length)]).join('');

        document.getElementById('gen').addEventListener('click', () => {
            const key = SubscriptionManager.buildKey(group(), group());
            document.getElementById('key').textContent = key;
            navigator.clipboard && navigator.clipboard.writeText(key);

            const client = document.getElementById('client').value.trim() || '—';
            const line = document.createElement('div');
            line.textContent = `${key}  |  ${client}  |  ${new Date().toLocaleDateString('fr-MA')}`;
            document.getElementById('history').prepend(line);
        });
    </script>
</body>
</html>
